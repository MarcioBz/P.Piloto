<!doctype html>
<!-- =====================================================
     ALUNOTEC | MAPA DE EDIÇÃO — INSTITUIÇÃO
     Estrutura: formulário dos dados da escola e status de salvamento.
     Visual compartilhado: ../shared/management.css.
     Comportamento: inst.js carrega/salva os campos pelo ID; mantenha os
     IDs alinhados entre o formulário e a lista de campos do script.
===================================================== -->

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#073a54" />
    <title>AlunoTec | Instituição</title>
    <link rel="icon" type="image/png" href="../assets/icons/icone.png" />
    <link rel="stylesheet" href="../shared/management.css" />

    <link rel="stylesheet" href="../shared/responsive-shell.css" />
    <link rel="stylesheet" href="../shared/profile.css" />
    <link rel="stylesheet" href="../shared/banner.css" />
    <script src="../shared/app-shell.js" defer></script>
    <script src="../shared/banner.js" defer></script>
    <script src="../shared/profile.js" defer></script>
    <script src="inst.js" defer></script>
  </head>
  <body data-app-page="institution">
    <!-- =====================================================
     NAVEGAÇÃO COMPARTILHADA
     O menu e o topbar são montados por ../shared/app-shell.js.
===================================================== -->
    <!-- =====================================================
         DADOS DA INSTITUIÇÃO
         O formulário abaixo é carregado e salvo pelo arquivo inst.js.
    ===================================================== -->
    <main class="management-main">
      <div class="management-heading">
        <p>Administração</p>
        <h1>Instituição</h1>
        <div class="lead">
          Mantenha os dados de identificação da escola usados pela equipe.
        </div>
      </div>
      <section class="management-card" aria-labelledby="institutionTitle">
        <h2 id="institutionTitle">Dados da escola</h2>
        <form id="institutionForm">
          <div class="management-form-grid">
            <!-- =====================================================
                 IDENTIFICAÇÃO DA ESCOLA
                 Nome e código INEP usados para identificar a instituição.
            ===================================================== -->
            <label class="management-field management-span-2" for="schoolName"
              >Nome da instituição
              <input
                id="schoolName"
                name="schoolName"
                maxlength="120"
                required
                autocomplete="organization"
              />
            </label>
            <label class="management-field" for="schoolInep"
              >Código INEP
              <input
                id="schoolInep"
                name="schoolInep"
                inputmode="numeric"
                pattern="[0-9]{8}"
                maxlength="8"
                title="Informe os 8 números do código INEP"
              />
            </label>
            <!-- =====================================================
                 CONTATO E LOCALIZAÇÃO
                 Telefone, e-mail, endereço, município e unidade federativa.
            ===================================================== -->
            <label class="management-field" for="schoolPhone"
              >Telefone
              <input
                id="schoolPhone"
                name="schoolPhone"
                type="tel"
                maxlength="30"
                autocomplete="tel"
              />
            </label>
            <label class="management-field management-span-2" for="schoolEmail"
              >E-mail institucional
              <input
                id="schoolEmail"
                name="schoolEmail"
                type="email"
                maxlength="160"
                autocomplete="email"
              />
            </label>
            <label
              class="management-field management-span-2"
              for="schoolAddress"
              >Endereço
              <input
                id="schoolAddress"
                name="schoolAddress"
                maxlength="180"
                autocomplete="street-address"
              />
            </label>
            <label class="management-field" for="schoolCity"
              >Município
              <input
                id="schoolCity"
                name="schoolCity"
                maxlength="100"
                autocomplete="address-level2"
              />
            </label>
            <label class="management-field" for="schoolState"
              >UF
              <input
                id="schoolState"
                name="schoolState"
                maxlength="2"
                pattern="[A-Za-z]{2}"
                title="Informe a sigla de dois caracteres"
                autocomplete="address-level1"
              />
            </label>
          </div>
          <!-- =====================================================
               AÇÕES E RETORNO
               Salvar os dados, limpar os campos e mostrar o status da operação.
          ===================================================== -->
          <div class="management-actions">
            <button class="management-button" type="submit">Salvar dados</button
            ><button
              class="management-button secondary"
              id="clearInstitution"
              type="button"
            >
              Limpar formulário
            </button>
          </div>
          <p
            class="management-status"
            id="institutionStatus"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>
      <!-- =====================================================
           AVISO DE ARMAZENAMENTO
           Explica onde os dados desta tela ficam salvos.
      ===================================================== -->
      <p class="management-note">
        Essas informações são salvas somente no armazenamento local deste
        navegador. A autenticação institucional precisa ser conectada
        separadamente a um serviço seguro.
      </p>
    </main>
  </body>
</html>
